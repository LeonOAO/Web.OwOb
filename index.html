<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OwO Simple Browser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2752%27 font-size=%2752%27%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="tabs"><div id="tabs" class="tab-list"></div><button id="newTab" class="icon" title="新增分頁">＋</button></header>
    <nav class="toolbar">
      <button id="back" class="icon">←</button><button id="forward" class="icon">→</button><button id="reload" class="icon">↻</button><button id="home" class="icon">⌂</button>
      <form id="addressForm" class="address"><span>🔒</span><input id="address" autocomplete="off" spellcheck="false" placeholder="輸入網址或搜尋內容"><button>前往</button></form>
      <button id="settings" class="icon">⚙</button>
    </nav>
    <div id="progress" class="progress"></div>
    <main id="views" class="views"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
