<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- 登入驗證守門程式 -->
    <script src="./JavaScript/wOvOw.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OwO Simple Browser</title>
    <link rel="icon" href="./Assets/favico.ico" type="image/x-icon">
    <!-- 圖示字型 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- 主樣式（亮色 / 深色主題皆由 body class 切換） -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-light">

    <!-- ==================== 分頁列 ==================== -->
    <header class="TabBar">
        <div id="TabList" class="TabList"></div>
        <button id="AddTabButton" class="AddTabButton" title="新增分頁 (Alt+T)">
            <i class="fa-solid fa-plus"></i>
        </button>
    </header>

    <!-- ==================== 工具列 ==================== -->
    <nav class="ToolBar">
        <button id="BackButton"    class="ToolButton" title="上一頁 (Alt+←)"><i class="fa-solid fa-arrow-left"></i></button>
        <button id="ForwardButton" class="ToolButton" title="下一頁 (Alt+→)"><i class="fa-solid fa-arrow-right"></i></button>
        <button id="ReloadButton"  class="ToolButton" title="重新整理 (F5)"><i class="fa-solid fa-rotate-right"></i></button>
        <button id="HomeButton"    class="ToolButton" title="首頁"><i class="fa-solid fa-house"></i></button>

        <!-- 網址列：圖示 / 輸入框 / 縮放指示 / 書籤星號 / 自動完成清單 -->
        <form id="AddressForm" class="AddressBar" autocomplete="off">
            <i id="AddressIcon" class="fa-solid fa-magnifying-glass AddressIcon"></i>
            <input id="AddressInput" type="text" placeholder="使用 Bing 搜尋或輸入網址" spellcheck="false">
            <button id="ZoomButton"     type="button" class="AddressAction ZoomBadge" title="重設縮放 (Ctrl+0)" hidden>100%</button>
            <button id="BookmarkButton" type="button" class="AddressAction" title="加入書籤 (Ctrl+D)">
                <i class="fa-regular fa-star"></i>
            </button>
            <ul id="SuggestList" class="SuggestList" hidden></ul>
        </form>

        <button id="ThemeButton"    class="ToolButton" title="切換深色/亮色"><i class="fa-solid fa-moon"></i></button>
        <button id="SettingsButton" class="ToolButton" title="設定"><i class="fa-solid fa-gear"></i></button>
    </nav>

    <!-- 載入進度條 -->
    <div id="LoadingBar" class="LoadingBar"></div>

    <!-- ==================== 分頁內容區 ==================== -->
    <main id="ViewArea" class="ViewArea">

        <!-- 頁內搜尋列（Ctrl+F） -->
        <div id="FindBar" class="FindBar" hidden>
            <input id="FindInput" type="text" placeholder="在頁面中尋找" spellcheck="false" autocomplete="off">
            <span id="FindStatus" class="FindStatus"></span>
            <button id="FindPrevButton"  class="ToolButton Small" title="上一個 (Shift+Enter)"><i class="fa-solid fa-chevron-up"></i></button>
            <button id="FindNextButton"  class="ToolButton Small" title="下一個 (Enter)"><i class="fa-solid fa-chevron-down"></i></button>
            <button id="FindCloseButton" class="ToolButton Small" title="關閉 (Esc)"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </main>

    <!-- 匯入設定用的隱藏檔案選擇器 -->
    <input id="ImportInput" type="file" accept="application/json,.json" hidden>

    <!-- 提示訊息 -->
    <div id="Toast" class="Toast"></div>

    <script src="script.js"></script>
</body>
</html>
